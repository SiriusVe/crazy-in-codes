<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo</title>
    <style>
        /* Cabeçalho */
        header div a{font-family: "Press Start 2P", monospace;
            color:#fff;
            text-decoration: none;
            font-size: 30px;} /* Nome do Jogo */
        .contorno-crazy{display: inline-flex;
            flex-direction: row;
            letter-spacing: -15px;
            text-shadow: -2px 0 #fcfcfc, 2px 0 #fcfcfc,0 -2px #fcfcfc, 0 2px #fcfcfc;} /* contorno do Crazy */
        .contorno-codes{text-shadow: -2px 0 #fcfcfc, 2px 0 #fcfcfc, 0 -2px #fcfcfc, 0 2px #fcfcfc;}
        nav a{text-decoration: none;
            color:#fff; font-family: "Press Start 2P", monospace;
            padding: 0.5rem 0.6rem;
            display: inline-block;} /* Opções do Menu */
        .in{margin-left: 15px;}
        *{box-sizing: border-box;
            margin:0px;
            padding: 0px;}
        body{display:grid; grid-template-rows: auto 1fr auto; min-height: 100vh;}
        .cabec{font-size:18px; background: #000000; color: #fff; padding: 1rem;
            display: flex; justify-content: space-between; align-items: center; position: relative;}
            .menu-toggle {display: none; background: none; border: none;
                            color: white; font-size: 1.7rem; cursor: pointer; margin-left: auto;}
            @media (max-width: 768px) /* Ajuste para telas menores */ {
            .menu-toggle { display: block;}
            .nav-menu { display: none; flex-direction: column; position: absolute;
                        top: 100%; /* Posiciona exatamente abaixo do header */
                        right: 0rem; /* Alinha na lateral direita, abaixo do botão hambúrguer */
                        width: 200px; /* Largura fixa para virar um menu suspenso (dropdown) */
                        background: rgb(0, 0, 0); /* Cor levemente diferente para destacar o menu */
                        padding: 0.5rem 0; text-align: center; color:#fff;
                        text-decoration: none; z-index: 10;
                        border-radius: 4px; /* Cantos arredondados para acabamento */
                        box-shadow: 0px 4px 6px rgba(0,0,0,0.2); /* Sombra para dar profundidade */}
                   
            .nav-menu a {color:#fff;
                        display: block;
                        padding: 0.75rem 0;
                        margin: 0;}
            .nav-menu a:hover {background: #555; }
            .nav-menu.active {display: flex; }
            }

        /* Início */
        main{background: #000; position: relative;}
        .inicio {position: relative;
                background: #000;}
        .atras {display: block; width: 100%;
                height: auto;
                image-rendering: pixelated;}
        .trilho {position: absolute; top: 0;
                bottom: 0;/* a logo solta um pouco antes do fim da imagem */ 
                left: 0; width: 100%;
                pointer-events: none;
                z-index: 2;}
        .frente {position: sticky; top: 35vh;/* posição da logo na tela enquanto você rola */
                display: block;
                margin: 20vh auto 0;/* posição inicial, no começo da página */
                width: 25%;
                max-width: 300px; height: auto;
                image-rendering: pixelated;}
                /* sombra no fim da imagem */
        .inicio::after {content: ""; position: absolute;
                        left: 0; bottom: -1px;
                        width: 100%; height: 50%;
                        pointer-events: none; z-index: 1;
                        background: linear-gradient(to bottom,
                            rgba(0,0,0,0) 0%, rgba(0,0,0,0.03) 10%, rgba(0,0,0,0.10) 20%,
                            rgba(0,0,0,0.22) 30%, rgba(0,0,0,0.38) 40%, rgba(0,0,0,0.55) 50%,
                            rgba(0,0,0,0.72) 60%, rgba(0,0,0,0.85) 70%, rgba(0,0,0,0.94) 80%,
                            rgba(0,0,0,0.99) 90%, #000 100%);}
        @media (max-width: 768px) {
            .atras {height: auto;
                    object-position: center;}
            .frente {width: 25%;
                    top: 15vh;
                    margin: 10vh auto 0;}
            .trilho {bottom: -30vh;}
    }

        /*gameplay*/
        .gameplay{background: #000; color: #fff; font-family: "Press Start 2P", monospace; margin-top: 3rem; padding: 3rem 1rem 15vh;
                  min-height: 85vh; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                  grid-template-areas:
                        "video titulo"
                        "video texto";
                  align-content: center; column-gap: 2rem; max-height: auto;}
        .gameplay > div{ display: contents; }   /* faz o vídeo e o texto virarem itens do grid */
        .gameplay h2{grid-area: titulo; align-self: end; font-size: 60px; text-align: right; margin: 0 140px 1rem 0;}
        .gameplay p{grid-area: texto; align-self: start; justify-self: end; max-width: 400px; font-size: 30px;
                    line-height: 1.8; text-align: right; margin: 0 90px;}
        .video{grid-area: video; align-self: center; justify-self: start; width: 70%; max-width: 600px; aspect-ratio: 16/9;
               border: 4px solid #fff; border-radius: 8px; overflow: hidden; background: #000; margin: 0 0 0 2rem;}
        @media (max-width: 768px){
            .gameplay{min-height: auto; height: auto; padding: 3vw 2vw;}
            .gameplay h2{font-size: clamp(14px, 5vw, 60px); margin: 0; white-space: nowrap;}
            .logo{width: 25vw; max-width: 100%; margin: 0 }
            .gameplay p{ font-size: clamp(6px, 2.4vw, 14px); list-style: 1.4; margin: 0; padding: 0; width: 100%; max-width: 100%;}
            .video{ width: 70%; margin: 1.5rem 0; }
        }
    </style>
</head>
<body>
    <header class="cabec">
        <div><a href="#https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
            <span class="contorno-crazy" style="color: rgb(0, 140, 255);">C</span>
            <span class="contorno-crazy" style="color: rgb(251, 255, 0);">R</span>
            <span class="contorno-crazy" style="color: rgb(255, 0, 0);">A</span>
            <span class="contorno-crazy" style="color: rgb(0, 140, 255);">Z</span>
            <span class="contorno-crazy" style="color: rgb(251, 255, 0);">Y</span> 
            <span class="in">in</span>
            <span class="contorno-codes" style="color: rgb(0, 0, 0);">CODES</span></a></div>
            <button class="menu-toggle">&equiv;</button> 
        <nav class="nav-menu">
            <a href="#https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">Início</a>
            <a href="#https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">Gameplay</a>
            <a href="#https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">Personagens</a>
            <a href="#https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">Cenários</a>
            <a href="#https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">Documento</a>
            <a href="#https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">Git Hub</a>
        </nav>
    </header>
    <main>
        <div class="trilho">
                <img class="frente" src="Imagens/Logodojogo-semfundo.png" alt="Logo do Jogo">
        </div>
        <section class="inicio">
            <img class="atras" src="Imagens/Cenario.fase2.png" alt="Cenário">
        </section>
        <section class="gameplay">
            <h2>Gameplay</h2>
            <div>
                <div class="video">
                    <video></video>
                </div>
                <p href="#https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">Vídeo de Jogabilidade com tutorial mostrando
                detalhes sobre nosso jogo!!!</p>
            </div>
        </section>
    </main>
    <footer>

    </footer>
    <script>
        /* Script para alternar o menu em telas menores */
        const menuToggle = document.querySelector('.menu-toggle');
        const navMenu = document.querySelector('.nav-menu');
        menuToggle.addEventListener('click', () => {
        navMenu.classList.toggle('active');
});
    </script>
</body>
</html>
